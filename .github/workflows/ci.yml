name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  app:
    name: Desktop app (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ai-service:
    name: Python AI service (train classifier, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/train_classifier.py
      - run: pytest -q
